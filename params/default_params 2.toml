[system]
version = "0.6"
[system.params]

[component]
stop_on_error = true
# component_name is optional; by default the component directory name is used.
[component.params]

[[arsenals]]
id = "local-models"
config_path = "@comp/zemi/llm_curated_set_model_mode.toml"
lifecycle = "job"
[arsenals.params]

[[modules]]
kind = "playbook"
id = "default"
path = "@comp/playbook.ipynb"
arsenal = "local-models"
enabled = true
[modules.params]
model_name = "lfm2_350m"

[[modules]]
kind = "playbook"
id = "excel-gbnf"
path = "@comp/playbook_excel_ling30_gbnf.ipynb"
arsenal = "local-models"
enabled = true
[modules.params]
model_name = "ling30_tiny"

# See readme.md for the canonical Params 0.6 example.
